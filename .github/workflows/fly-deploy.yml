name: Fly Deploy

# Every commit BUILDS both images (so a broken Dockerfile is caught immediately,
# on any branch and on every PR). Only pushes to `main` DEPLOY.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One deploy at a time per branch; a newer commit cancels an in-flight build.
  group: fly-${{ github.ref }}
  cancel-in-progress: true

env:
  FLY_REGION: bom

jobs:
  # ── Build both images on EVERY commit ──────────────────────────────────────
  build:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          push: false
          load: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

  # ── Deploy only from main, and only if CI + build are green ────────────────
  deploy-backend:
    name: Deploy backend
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # release_command runs `alembic upgrade head` before machines take traffic;
      # a failed migration fails the deploy and the old version keeps serving.
      - name: Deploy to Fly
        run: flyctl deploy --config backend/fly.toml --dockerfile backend/Dockerfile ./backend --remote-only --wait-timeout 600
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify /health
        run: |
          set -e
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ vars.API_HOST }}/health" || true)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Backend health check never returned 200"
          exit 1

  deploy-frontend:
    name: Deploy frontend
    needs: [build, deploy-backend]   # API must be live before the storefront points at it
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: |
          flyctl deploy --config frontend/fly.toml --dockerfile frontend/Dockerfile ./frontend \
            --remote-only --wait-timeout 600 \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_RAZORPAY_KEY_ID="${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ vars.NEXT_PUBLIC_SENTRY_DSN }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify storefront responds
        run: |
          set -e
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ vars.WEB_HOST }}/" || true)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Storefront never returned 200"
          exit 1
