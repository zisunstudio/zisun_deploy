name: ZISUN CI Pipeline

on:
  push:
    branches: ["main", "develop", "claude/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: zisun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint — hard fail on syntax/undefined
        run: flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint — style warnings (soft)
        run: flake8 app --count --exit-zero --max-complexity=10 --max-line-length=120

      - name: Audit — no raw SQL string interpolation
        run: |
          if grep -rn 'f"SELECT\|f"INSERT\|f"UPDATE\|f"DELETE\|f"DROP' app/; then
            echo "❌ Found raw SQL string interpolation — SQL injection risk"
            exit 1
          else
            echo "✅ No raw SQL interpolation found"
          fi

      - name: Run Alembic migrations against test DB
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: zisun_test
          POSTGRES_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: development
        run: alembic upgrade head

      - name: Run pytest with coverage
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: zisun_test
          POSTGRES_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: development
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check & build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_placeholder

  # ── Migration completeness check ───────────────────────────────────────────
  migration-check:
    name: Alembic — migration completeness check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: zisun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: zisun_test
          POSTGRES_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: development
        run: alembic upgrade head

      - name: Check for model changes without migration
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: zisun_test
          POSTGRES_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: development
        run: |
          alembic check && echo "✅ No pending migrations" || (echo "❌ Model changes detected without a migration file" && exit 1)

  # ── Security scan ──────────────────────────────────────────────────────────
  security-scan:
    name: Security — bandit + safety
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: pip install bandit safety
      - name: Run bandit (security linter)
        run: bandit -r app -ll --exit-zero
      - name: Check dependencies for known vulnerabilities
        run: safety check -r requirements.txt --continue-on-error

  # ── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy — Build, push, and health-check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, migration-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: runtime
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/zisun-backend:${{ github.sha }},${{ secrets.REGISTRY_URL }}/zisun-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/zisun-frontend:${{ github.sha }},${{ secrets.REGISTRY_URL }}/zisun-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/zisun
            docker pull ${{ secrets.REGISTRY_URL }}/zisun-backend:latest
            docker pull ${{ secrets.REGISTRY_URL }}/zisun-frontend:latest
            docker compose -f docker-compose.prod.yml up -d --no-deps backend celery-worker celery-beat frontend

            # Wait for health check
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health; then
                echo "Backend healthy"
                exit 0
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done
            echo "Health check failed — rolling back"
            docker compose -f docker-compose.prod.yml rollout backend
            exit 1
