# ZISUN storefront (Next.js) — Fly.io
# Deploy: fly deploy --config frontend/fly.toml --dockerfile frontend/Dockerfile
#
# NOTE: NEXT_PUBLIC_* values are baked in at BUILD time, not read at runtime.
# They must be passed as --build-arg (the CI workflow does this), not as secrets.

app = "zisun-web"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
